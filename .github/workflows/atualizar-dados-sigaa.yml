# Atualiza professores, disciplinas e turmas a partir do SIGAA (issue #225).
#
# Disparo manual: aba Actions > "Atualizar dados do SIGAA" > Run workflow.
# Passo a passo completo em docs/COMO_USAR_SCRAPER.md.
#
# - modo "dry-run": coleta e mostra o que seria gravado. Não usa nenhuma chave.
# - modo "gravar": usa o environment "producao" (onde ficam os
#   segredos SUPABASE_URL e SUPABASE_SERVICE_KEY), grava no Supabase e abre um
#   PR com os CSVs de docs/backup atualizados.
name: Atualizar dados do SIGAA

on:
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano das turmas (4 dígitos, ex.: 2027)"
        required: true
        type: string
      periodo:
        description: "Período das turmas"
        required: true
        type: choice
        options: ["1", "2", "3", "4"]
      modo:
        description: "dry-run só mostra os dados; gravar escreve no Supabase pelo ambiente producao"
        required: true
        type: choice
        default: dry-run
        options: [dry-run, gravar]
      unidades:
        description: "Opcional: values das unidades separados por espaço ou vírgula (ex.: 673 12). Vazio = todas"
        required: false
        type: string
        default: ""

      finalidade:
        description: "Histórica e antecipada nunca confirmam semestre atual"
        required: true
        type: choice
        default: regular
        options: [regular, historica, antecipada]
      confirmar_semestre:
        description: "Opcional: AAAA-P para propor semestre atual após coleta completa gravada (ex.: 2026-2)"
        required: false
        type: string
        default: ""

# Nunca rodar duas coletas ao mesmo tempo (evita gravações concorrentes).
concurrency:
  group: atualizar-dados-sigaa
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8

jobs:
  validar-entrada:
    runs-on: ubuntu-latest
    steps:
      - name: Validar confirmação explícita
        env:
          ANO: ${{ inputs.ano }}
          PERIODO: ${{ inputs.periodo }}
          MODO: ${{ inputs.modo }}
          UNIDADES: ${{ inputs.unidades }}
          FINALIDADE: ${{ inputs.finalidade }}
          CONFIRMAR: ${{ inputs.confirmar_semestre }}
        run: |
          if [[ ! "$ANO" =~ ^[0-9]{4}$ || ! "$PERIODO" =~ ^[1-4]$ ]]; then
            echo "::error::Ano ou período inválido."
            exit 1
          fi
          if [ -n "$CONFIRMAR" ]; then
            if [ "$MODO" != "gravar" ] || [ -n "$UNIDADES" ] || [ "$FINALIDADE" != "regular" ] || [ "$CONFIRMAR" != "$ANO-$PERIODO" ]; then
              echo "::error::Confirmação exige gravar, todas as unidades, finalidade regular e o mesmo par AAAA-P."
              exit 1
            fi
          fi

  dry-run:
    needs: validar-entrada
    if: inputs.modo == 'dry-run'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-scraper.txt
      # O runner tem Google Chrome e Chromium. Sem isto, o undetected-chromedriver
      # pode abrir o Chromium e baixar um driver de outra versão
      # (SessionNotCreatedException). As variáveis são lidas em scraper/cli_sigaa.py.
      - name: Apontar o scraper para o Google Chrome do runner
        run: |
          binario=$(command -v google-chrome-stable || command -v google-chrome)
          versao=$("$binario" --version | grep -oE '[0-9]+' | head -n 1)
          echo "Usando $("$binario" --version) em $binario"
          echo "CHROME_BINARY=$binario" >> "$GITHUB_ENV"
          echo "CHROME_VERSION_MAIN=$versao" >> "$GITHUB_ENV"

      - name: Rodar o scraper (dry-run, sem chaves)
        id: scraper
        env:
          ANO: ${{ inputs.ano }}
          PERIODO: ${{ inputs.periodo }}
          UNIDADES: ${{ inputs.unidades }}
          FINALIDADE: ${{ inputs.finalidade }}
        run: |
          args=(--headless --dry-run --ano "$ANO" --periodo "$PERIODO" --relatorio coleta.json --finalidade "$FINALIDADE")
          for u in ${UNIDADES//,/ }; do
            if [[ ! "$u" =~ ^[0-9]+$ ]]; then
              echo "::error::Unidade inválida: '$u' (use só o value numérico)"
              exit 2
            fi
            args+=(--unidade "$u")
          done
          set +e
          python scraper/scraper_sigaa.py "${args[@]}" 2>&1 | tee scraper.log
          codigo=${PIPESTATUS[0]}
          set -e
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          {
            echo "## Dry-run $ANO/$PERIODO (código de saída $codigo)"
            echo '```'
            tail -n 40 scraper.log
            echo '```'
            echo "O log completo está no artifact **scraper-log**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar log e pasta debug/
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log
          path: |
            scraper.log
            coleta.json
            debug/
          if-no-files-found: ignore
          retention-days: 14

      - name: Falhar se alguma unidade deu erro
        if: steps.scraper.outputs.codigo != '0'
        run: |
          echo "::error::O scraper saiu com código ${{ steps.scraper.outputs.codigo }}. Veja o resumo e o artifact scraper-log."
          exit 1

  gravar:
    needs: validar-entrada
    if: inputs.modo == 'gravar'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Os segredos ficam neste environment; suas regras de aprovação são configuradas no GitHub.
    environment: producao
    permissions:
      contents: write        # enviar a branch com o backup
      pull-requests: write   # abrir o PR do backup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements-scraper.txt
      # O runner tem Google Chrome e Chromium. Sem isto, o undetected-chromedriver
      # pode abrir o Chromium e baixar um driver de outra versão
      # (SessionNotCreatedException). As variáveis são lidas em scraper/cli_sigaa.py.
      - name: Apontar o scraper para o Google Chrome do runner
        run: |
          binario=$(command -v google-chrome-stable || command -v google-chrome)
          versao=$("$binario" --version | grep -oE '[0-9]+' | head -n 1)
          echo "Usando $("$binario" --version) em $binario"
          echo "CHROME_BINARY=$binario" >> "$GITHUB_ENV"
          echo "CHROME_VERSION_MAIN=$versao" >> "$GITHUB_ENV"

      - name: Guardar backup do catálogo antes de qualquer escrita
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/manutencao_banco.py backup --destino backup-antes

      # Desde a #236 o importador grava nomes em grafia comum. Se o banco ainda tiver
      # nomes em CAIXA ALTA, a trava do importador para com código 2 sem gravar nada.
      # A conversão é idempotente (sem pendências, não altera nada) e aborta sem
      # gravar se dois professores ficariam com o mesmo nome.
      - name: Converter nomes já gravados para a grafia comum
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set +e
          python scraper/manutencao_banco.py converter-nomes --gravar 2>&1 | tee conversao.log
          codigo=${PIPESTATUS[0]}
          set -e
          {
            echo "## Conversão de nomes (código de saída $codigo)"
            echo '```'
            tail -n 25 conversao.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$codigo" != "0" ]; then
            echo "::error::A conversão de nomes falhou (colisão ou erro de gravação). O scraper não foi executado. Veja conversao.log no artifact scraper-log."
            exit 1
          fi

      - name: Rodar o scraper e gravar no Supabase
        id: scraper
        env:
          ANO: ${{ inputs.ano }}
          PERIODO: ${{ inputs.periodo }}
          UNIDADES: ${{ inputs.unidades }}
          FINALIDADE: ${{ inputs.finalidade }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          args=(--headless --ano "$ANO" --periodo "$PERIODO" --relatorio coleta.json --finalidade "$FINALIDADE")
          for u in ${UNIDADES//,/ }; do
            if [[ ! "$u" =~ ^[0-9]+$ ]]; then
              echo "::error::Unidade inválida: '$u' (use só o value numérico)"
              exit 2
            fi
            args+=(--unidade "$u")
          done
          set +e
          python scraper/scraper_sigaa.py "${args[@]}" 2>&1 | tee scraper.log
          codigo=${PIPESTATUS[0]}
          set -e
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          {
            echo "## Gravação $ANO/$PERIODO (código de saída $codigo)"
            echo '```'
            tail -n 40 scraper.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Roda mesmo se alguma unidade falhou: o que foi coletado já está no banco.
      - name: Verificar duplicatas
        id: duplicatas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set +e
          python scraper/manutencao_banco.py duplicatas 2>&1 | tee duplicatas.log
          codigo=${PIPESTATUS[0]}
          set -e
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          if [ "$codigo" != "0" ]; then
            echo "::warning::Foram encontradas duplicatas no catálogo. Veja o artifact scraper-log."
          fi

      - name: Propor semestre atual somente após validação completa
        id: confirmacao
        if: inputs.confirmar_semestre != '' && steps.scraper.outputs.codigo == '0' && steps.duplicatas.outputs.codigo == '0'
        env:
          CONFIRMAR: ${{ inputs.confirmar_semestre }}
        run: |
          python -m scraper.confirmar_semestre coleta.json --confirmar "$CONFIRMAR" --gravar > confirmacao.log
          cat confirmacao.log
          echo "Configuração gerada para revisão no PR de dados; só entra em produção após merge/deploy." >> "$GITHUB_STEP_SUMMARY"

      - name: Atualizar o backup em docs/backup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scraper/manutencao_banco.py backup --destino docs/backup

      - name: Abrir PR com o backup atualizado
        env:
          GH_TOKEN: ${{ github.token }}
          ANO: ${{ inputs.ano }}
          PERIODO: ${{ inputs.periodo }}
          CODIGO: ${{ steps.scraper.outputs.codigo }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/backup config/semestre_atual.json; then
            echo "Backup sem mudanças; nenhum PR aberto." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="dados/sigaa-$ANO-$PERIODO-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/backup config/semestre_atual.json
          git commit -m "dados: atualiza backup do catálogo ($ANO/$PERIODO)"
          git push origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "dados: backup do catálogo após coleta do SIGAA $ANO/$PERIODO" \
            --body "Backup gerado automaticamente pelo workflow **Atualizar dados do SIGAA** ([execução]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)).

          - Período coletado: $ANO/$PERIODO
          - Código de saída do scraper: $CODIGO (0 = todas as unidades lidas)

          Os dados já estão no Supabase; este PR versiona o backup e, somente se a confirmação explícita passou, a configuração de semestre atual. Confira o diff antes do merge. CSVs de \`docs/backup\`. Relacionado à #225." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Guardar logs e pasta debug/
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log
          path: |
            conversao.log
            confirmacao.log
            scraper.log
            coleta.json
            duplicatas.log
            backup-antes/
            debug/
          if-no-files-found: ignore
          retention-days: 14

      - name: Falhar se alguma unidade deu erro
        if: steps.scraper.outputs.codigo != '0'
        env:
          CODIGO: ${{ steps.scraper.outputs.codigo }}
        run: |
          if [ "$CODIGO" = "2" ]; then
            echo "::error::Importação interrompida pela trava de nomes em CAIXA ALTA (código 2). Nada foi gravado. Rode 'python scraper/manutencao_banco.py converter-nomes --gravar' e dispare o workflow de novo."
          else
            echo "::error::O scraper saiu com código $CODIGO. Os dados das unidades lidas já foram gravados; rode de novo só as unidades que falharam."
          fi
          exit 1
      - name: Falhar se a confirmação solicitada não foi validada
        if: inputs.confirmar_semestre != '' && steps.confirmacao.outcome != 'success'
        run: |
          echo "::error::Semestre atual não confirmado: cobertura, persistência ou duplicatas precisam de revisão. A configuração não foi ativada."
          exit 1
